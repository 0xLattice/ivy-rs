[package]
name = "ivy-core"
version = "0.1.0"
description = "Ivy's wire protocol as plain data: session handshake, signed records, messages"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = "0.6"
sha2 = "0.10"

[dev-dependencies]
rand_core = { version = "0.6", features = ["getrandom"] }
